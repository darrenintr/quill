# Builds an unsigned .ipa that you can sideload onto your iPad with
# AltStore / Sideloadly. No Apple Developer account required.
#
# Triggered on: push to main, pull_request, manual dispatch.
name: Build iOS (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    name: Build unsigned IPA
    runs-on: macos-14

    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      FLUTTER_ROOT: ${{ github.workspace }}/flutter
      EXPORT_OPTIONS_PATH: ${{ github.workspace }}/ios/ExportOptions.plist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v
          sw_vers
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      # Some plugins (device_info_plus, super_native_extensions) don't yet
      # support Swift Package Manager. Disable SPM so CocoaPods handles
      # plugin discovery instead.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # `flutter build ios --no-codesign` still refuses to build when the
      # Xcode project's CODE_SIGN_STYLE is Automatic, even with all the
      # right env vars. The workaround: run `flutter build ios --config-only`
      # (which only generates the .xcconfig), then call xcodebuild ourselves
      # with CODE_SIGNING_ALLOWED=NO. The resulting .app is what we package
      # into the .ipa.
      - name: Configure iOS project
        working-directory: ios
        run: flutter build ios --config-only

      - name: Build .app with code signing disabled
        working-directory: ios
        run: |
          set -e
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Locate .app bundle
        id: locate
        working-directory: ios
        run: |
          set -e
          APP="$(find build/DerivedData -maxdepth 6 -name 'Runner.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "Could not locate Runner.app under build/DerivedData" >&2
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP"

      - name: Package .app into unsigned .ipa
        run: |
          set -e
          APP="${{ steps.locate.outputs.app }}"
          OUT="$GITHUB_WORKSPACE/quill-unsigned.ipa"

          TMP="$(mktemp -d)"
          mkdir -p "$TMP/Payload"
          cp -R "$APP" "$TMP/Payload/Runner.app"

          # iOS expects the standard App Store layout: Payload/<App>.app
          # zipped up. AltStore / Sideloadly accept exactly this format.
          (cd "$TMP" && zip -qr "$OUT" Payload)

          ls -lh "$OUT"
          echo "Wrote unsigned IPA: $OUT"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: quill-ios-unsigned
          path: quill-unsigned.ipa
          if-no-files-found: error
          retention-days: 30