# Builds an unsigned .ipa that you can sideload onto your iPad with
# AltStore / Sideloadly. No Apple Developer account required.
#
# We avoid `flutter build ios` entirely because it always validates the
# Development Team, even with --no-codesign or --config-only. Instead we:
#   1. Run `flutter precache --ios` to fetch the engine artifacts.
#   2. Run `pod install` to wire up the plugin pods.
#   3. Run `xcodebuild` directly with CODE_SIGNING_ALLOWED=NO.
#   4. Zip the resulting .app into Payload/Runner.app and rename to .ipa.
#
# Triggered on: push to main, pull_request, manual dispatch.
name: Build iOS (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    name: Build unsigned IPA
    runs-on: macos-14

    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v
          sw_vers
          xcodebuild -version
          pod --version

      - name: Install dependencies
        run: flutter pub get

      # Some plugins (device_info_plus, super_native_extensions) don't yet
      # support Swift Package Manager. Disable SPM so CocoaPods handles
      # plugin discovery instead.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fetch iOS engine artifacts
        run: flutter precache --ios

      - name: Run pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Build .app with code signing disabled
        working-directory: ios
        run: |
          set -e
          rm -rf build/DerivedData
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Locate .app bundle
        id: locate
        working-directory: ios
        run: |
          set -e
          APP="$(find build/DerivedData -maxdepth 6 -name 'Runner.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "Could not locate Runner.app under build/DerivedData" >&2
            find build/DerivedData -maxdepth 4 -type d | head -30
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP"

      - name: Package .app into unsigned .ipa
        run: |
          set -e
          APP="${{ steps.locate.outputs.app }}"
          OUT="$GITHUB_WORKSPACE/quill-unsigned.ipa"

          TMP="$(mktemp -d)"
          mkdir -p "$TMP/Payload"
          cp -R "$APP" "$TMP/Payload/Runner.app"

          # iOS expects the standard App Store layout: Payload/<App>.app
          # zipped up. AltStore / Sideloadly accept exactly this format.
          (cd "$TMP" && zip -qr "$OUT" Payload)

          ls -lh "$OUT"
          echo "Wrote unsigned IPA: $OUT"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: quill-ios-unsigned
          path: quill-unsigned.ipa
          if-no-files-found: error
          retention-days: 30