# Builds an unsigned .ipa that you can sideload onto your iPad with
# AltStore / Sideloadly. No Apple Developer account required.
#
# Triggered on: push to main, pull_request, manual dispatch.
name: Build iOS (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    name: Build unsigned IPA
    runs-on: macos-14   # Apple Silicon runner with Xcode 15+

    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      FLUTTER_ROOT: ${{ github.workspace }}/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v
          sw_vers
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      # Some plugins (device_info_plus, super_native_extensions) don't yet
      # support Swift Package Manager. Disable SPM so CocoaPods handles
      # plugin discovery instead.
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # --no-codesign on `flutter build ios` produces a release .app bundle
      # without requiring a Development Team. We then zip the bundle into
      # a sideloadable .ipa manually because `flutter build ipa` always
      # insists on a team id.
      #
      # We also export the four xcconfig overrides below — Xcode's "Automatic"
      # signing style still wants a team even with --no-codesign, so we
      # force it off completely for this build.
      - name: Build unsigned .app
        working-directory: ios
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGNING_REQUIRED: 'NO'
          CODE_SIGN_IDENTITY: ''
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: ''
        run: |
          flutter build ios --release --no-codesign

      - name: Locate .app bundle
        id: locate
        working-directory: ios
        run: |
          set -e
          APP="$(find build/ios -maxdepth 5 -name 'Runner.app' -type d -print -quit)"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP"

      - name: Package .app into unsigned .ipa
        working-directory: ios
        run: |
          set -e
          APP="${{ steps.locate.outputs.app }}"
          OUT="$GITHUB_WORKSPACE/quill-unsigned.ipa"

          # `xcrun` knows how to assemble the iOS App Store package layout
          # (Payload/Runner.app) into a single zip — same format the App
          # Store accepts, so AltStore / Sideloadly will install it fine.
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/Payload"
          cp -R "$APP" "$TMP/Payload/Runner.app"

          # /Applications is a symlink on the runner; rsync preserves the
          # executable bit which cp sometimes loses for Mach-O files.
          rsync -a --delete "$TMP/Payload/" "$OUT.partial/" 2>/dev/null || \
            cp -R "$TMP/Payload" "$OUT.partial/"
          (cd "$TMP" && zip -qr "$OUT" Payload)

          ls -lh "$OUT"
          echo "Wrote unsigned IPA: $OUT"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: quill-ios-unsigned
          path: quill-unsigned.ipa
          if-no-files-found: error
          retention-days: 30