# Builds an unsigned .ipa that you can sideload onto your iPad with
# AltStore / Sideloadly / Xcode Devices. No Apple Developer account needed.
#
# Triggered on: push to main, pull_request, manual dispatch.
name: Build iOS (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-unsigned:
    name: Build unsigned IPA
    runs-on: macos-14   # Apple Silicon runner; Xcode 15+

    env:
      # Speed up Flutter & Gradle downloads inside the runner.
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      FLUTTER_ROOT: ${{ github.workspace }}/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          flutter doctor -v
          sw_vers
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          # --no-codesign produces an .xcarchive + .ipa without requiring
          # any provisioning profiles. The result is installable via
          # AltStore / Sideloadly for personal testing.
          flutter build ipa --release --no-codesign

      - name: Locate artifacts
        id: locate
        working-directory: ios
        run: |
          set -e
          IPA="$(find build/ios -maxdepth 4 -name '*.ipa' -print -quit)"
          ARCHIVE="$(find build/ios -maxdepth 4 -name 'Runner.xcarchive' -type d -print -quit)"
          echo "ipa=$IPA"  >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $IPA"
          echo "Found archive: $ARCHIVE"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: quill-ios-unsigned
          path: ${{ steps.locate.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: quill-ios-xcarchive
          path: ${{ steps.locate.outputs.archive }}
          if-no-files-found: warn
          retention-days: 7