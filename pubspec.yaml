name: quill
description: "Quill — A free, open-source, cross-platform note-taking app. iPad-first, Material You."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State management ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Navigation ----
  go_router: ^14.2.7

  # ---- Persistence (local DB) ----
  drift: ^2.20.3
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ---- Persistence (key-value) ----
  shared_preferences: ^2.3.2

  # ---- Rich text editor ----
  flutter_quill: ^11.0.0

  # ---- Theming ----
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1

  # ---- Utilities ----
  uuid: ^4.4.2
  intl: ^0.20.2
  collection: ^1.18.0
  meta: ^1.15.0
  flex_color_scheme: ^8.1.1
  super_drag_and_drop: ^0.8.20

  # ---- Handwriting ----
  # perfect_freehand gives us pressure-aware, vector stroke smoothing
  # identical to Excalidraw. Pure Dart, no platform deps.
  perfect_freehand: ^2.5.2

  # ---- Networking & auth (for OneDrive) ----
  http: ^1.2.2
  flutter_appauth: ^8.0.0+1

  # ---- Icons (Material Symbols Rounded) ----
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ---- Code generation ----
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  # No static assets bundled yet — Material Symbols are referenced via
  # IconData code points from the icon font that ships with the SDK.

  # Material Symbols outlined/rounded are referenced from code.